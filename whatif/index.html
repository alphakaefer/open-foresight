<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-foresight – world state</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --panel: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --bar: #2a78d6; --note: #f3f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1a1a19; --panel: #222221; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --bar: #3987e5; --note: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 32px 0 8px; }
  .meta { color: var(--ink2); font-size: 13px; }
  .note { background: var(--note); border-left: 3px solid var(--muted); padding: 10px 14px; margin: 16px 0; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink2); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--axis); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }
  .barcell { min-width: 150px; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .bar span.track { flex: 1; height: 10px; position: relative; }
  .bar span.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 4px 4px 0; }
  .bar b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  .delta { color: var(--ink2); font-size: 12px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; border: 1px solid var(--axis); color: var(--ink2); }
  .tag.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 18px 0 4px; }
  .controls .lbl { color: var(--ink2); font-size: 12px; margin-right: 2px; }
  button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--axis);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: #fff; }
  button:focus-visible, select:focus-visible, tr:focus-visible { outline: 2px solid var(--bar); outline-offset: 1px; }
  select:disabled { opacity: .5; cursor: not-allowed; }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { table { display: block; overflow-x: auto; } }
  .panel { background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; padding: 12px 16px; position: sticky; top: 12px; margin-top: 44px; }
  .panel h3 { margin: 0 0 6px; font-size: 16px; } .panel h4 { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); }
  .panel ul { padding-left: 18px; margin: 0; } .panel li { margin-bottom: 4px; }
  table.scen tr { cursor: pointer; } table.scen tr:hover td { background: var(--note); }
  tr.sel td { background: var(--note); } tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--bar); }
  table.mini th, table.mini td { padding: 4px 6px; }
  .bar span.ghost { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
  .bar .d { min-width: 30px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .bar .d.up::before { content: "▲ "; } .bar .d.down::before { content: "▼ "; }
  .note.hypo { border-left-color: var(--bar); }
  .regime .tag { margin: 0 4px 4px 0; }
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 10px 0 6px; }
  @media (max-width: 820px) { .why { grid-template-columns: 1fr; } }
  .why h4 { margin: 0 0 4px; font-size: 13px; color: var(--ink2); }
  .why ul { margin: 0; padding-left: 18px; } .why li { margin-bottom: 3px; }
  code { font-size: 12px; }
</style>
</head>
<body>
<main id="app">Loading… (run <code>python3 -B whatif/build_data.py</code> first if this stays.)</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
